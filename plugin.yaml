manifest_version: 1
name: hermes_galileo
version: "0.1.0"
description: "Direct Galileo observability for Hermes Agent using the official Galileo SDK."
author: hermes-galileo contributors
kind: standalone
requires_env:
  - GALILEO_API_KEY
  - GALILEO_PROJECT
  - GALILEO_LOG_STREAM
# `provides_hooks` is consumed by current standalone-plugin discovery.
provides_hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - pre_approval_request
  - post_approval_response
  - subagent_start
  - subagent_stop
# `hooks` keeps the manifest useful to Hermes versions and tooling that use
# the newer declarative field.
hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - pre_approval_request
  - post_approval_response
  - subagent_start
  - subagent_stop
